version: "3"
services:
  rskj:
    container_name: rsk-node
    image: rsksmart/rskj:VETIVER-9.0.4
    ports:
      - "127.0.0.1:4444:4444"
      - "127.0.0.1:4445:4445"
    networks:
      - "rif-relay-testing"
    volumes:
      - ./logback.xml:/etc/rsk/logback.xml
      - ./node.conf:/etc/rsk/node.conf
    environment:
      # the image default (-Xms4G) doesn't fit in Docker Desktop's default memory
      DEFAULT_JVM_OPTS: "-Xms512m -Xmx1g"
      RSKJ_LOG_PROPS: "-Dlogback.configurationFile=/etc/rsk/logback.xml"
    command: ["--regtest"]

networks:
  rif-relay-testing:
    external: true
